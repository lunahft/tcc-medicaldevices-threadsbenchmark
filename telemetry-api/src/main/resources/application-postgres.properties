spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospital_telemetry?currentSchema=telemetry}
spring.datasource.username=${DB_USERNAME:telemetry_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=telemetry
spring.flyway.schemas=telemetry
spring.flyway.create-schemas=false
spring.flyway.validate-migration-naming=true